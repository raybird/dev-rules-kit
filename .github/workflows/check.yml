name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查 skill frontmatter、版本宣告、雙語規則章節數與安裝路徑
        run: python3 scripts/check-kit.py
      - name: 檢查 Markdown 相對連結
        run: python3 scripts/check-links.py
      - name: 驗證安裝與專案初始化
        run: |
          bash -n scripts/install.sh
          python3 scripts/test-install.py
